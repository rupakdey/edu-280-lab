name: Validate Lab Guide

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-guide-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate template and guide
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check validator syntax
        run: python -m py_compile scripts/validate.py

      - name: Run lab guide validator
        run: |
          python scripts/validate.py \
            --json-report validation-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-guide-validation-report
          path: validation-report.json
          if-no-files-found: ignore
          retention-days: 7
