<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1060" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">EDU-280 Zero Trust Branch lab topology — high contrast annotated redraw</title>
<desc id="map-desc">Source-grounded topology with ZTE, DC DNS, two WAN links, active and standby ZTB gateways, GE3 management, GE4 HA, GE6 subnet10, GE7 subnet20, GE8 subnet30, and OT/IoT/Windows workloads. Logical traffic paths rather than physical wiring.</desc>
