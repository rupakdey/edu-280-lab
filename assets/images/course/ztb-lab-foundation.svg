<text x="722" y="166" fill="white" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">Zero Trust Exchange</text>
<text x="722" y="200" fill="#c9e2ff" text-anchor="middle" font-family="Arial" font-size="16">ZIA inspection • ZPA access</text>
