<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">EDU-280 Zero Trust Branch lab topology</title>
<desc id="desc">Zero Trust Exchange connected by shared Direct Internet Access to a high availability pair of Zero Trust Branch gateways, with branch VLAN segments and a ZPA App Connector.</desc>
<defs><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#0c2656"/><stop offset="1" stop-color="#1254a8"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2b73c8"/></marker></defs>
<rect width="1440" height="820" rx="32" fill="#f5f8fc"/>
<text x="54" y="54" fill="#173151" font-size="27" font-weight="750" font-family="Arial,sans-serif">EDU-280 • Zero Trust Branch lab foundation</text>
<text x="54" y="85" fill="#6a7d91" font-size="16" font-family="Arial,sans-serif">Conceptual topology • not a physical wiring or interface-port map</text>
