<text x="237" y="359" text-anchor="middle" fill="#183b65" font-family="Arial" font-size="24" font-weight="bold">Router / DIA</text>
<text x="237" y="390" text-anchor="middle" fill="#56738e" font-family="Arial" font-size="17">Shared WAN uplinks</text>
<text x="237" y="413" text-anchor="middle" fill="#56738e" font-family="Arial" font-size="15">Two WAN interfaces in lab</text>
