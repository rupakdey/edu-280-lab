<text x="70" y="102" font-size="44" fill="#172C42" font-weight="700" text-anchor="start">Zero Trust Branch</text>
<text x="70" y="140" font-size="23" fill="#52677B" font-weight="400" text-anchor="start">Dual-WAN branch with gateway redundancy and three LAN segments</text>
