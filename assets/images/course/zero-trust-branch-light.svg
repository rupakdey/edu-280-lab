<text x="770" y="308" font-size="22" fill="#7851AB" font-weight="600" text-anchor="middle">ZPA  ·  Private application access</text>
<text x="770" y="341" font-size="18" fill="#52677B" font-weight="400" text-anchor="middle">Traffic inspection and policy enforcement</text>
