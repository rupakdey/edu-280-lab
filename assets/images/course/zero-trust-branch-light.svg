<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1490" viewBox="0 0 1800 1490" role="img" aria-labelledby="title desc"><title id="title">Zero Trust Branch lab topology</title><desc id="desc">Two ZT800 gateways share two WAN networks, use GE4 for high availability and GE3 for management, and serve Server, IoT and OT LAN segments. ZIA provides Internet security; ZPA provides private access to the data center.</desc>
