<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="440" viewBox="0 0 1220 440" role="img" aria-labelledby="t d"><title id="t">Kill Switch mode-based SSH control</title><desc id="d">Green mode accepts SSH matching the policy. Orange mode activates the preconfigured Reject policy for TCP 22.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1220" height="440" rx="16" fill="#f8fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172b4d">One site, two preconfigured enforcement modes</text><g font-family="Arial,sans-serif"><rect x="35" y="93" width="550" height="260" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="635" y="93" width="550" height="260" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="65" y="135" font-size="24" font-weight="700" fill="#166534">GREEN · Normal operations</text><text x="665" y="135" font-size="24" font-weight="700" fill="#9a3412">ORANGE · Containment</text><text x="65" y="183" font-size="20" fill="#1f2937">LAN source → TCP 22 → Private subnet</text><text x="665" y="183" font-size="20" fill="#1f2937">Same policy match: LAN → LAN, TCP 22</text><rect x="68" y="211" width="478" height="58" rx="10" fill="#dcfce7" stroke="#16a34a"/><rect x="668" y="211" width="478" height="58" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="98" y="247" font-size="23" font-weight="700" fill="#14532d">ACCEPT · SSH session succeeds</text><text x="698" y="247" font-size="23" font-weight="700" fill="#7c2d12">REJECT · SSH is denied</text><text x="68" y="311" font-size="17" fill="#334155">Baseline test: 10.1.10.x → 10.1.30.10</text><text x="668" y="311" font-size="17" fill="#334155">Retest; check the Reject rule hit counter</text><path d="M586 214 L634 214" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="603" y="202" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Mode</text><text x="40" y="399" font-size="18" fill="#334155">After verification, restore GREEN. Restrict modes/policies to the intended site and traffic in production.</text></g></svg>