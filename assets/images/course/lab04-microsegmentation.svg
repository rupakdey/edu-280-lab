<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 750" role="img" aria-labelledby="title desc"><title id="title">ZTB macrosegmentation compared with endpoint-level microsegmentation</title><desc id="desc">Macrosegmentation blocks between network segments. Network-of-one /32 makes even endpoints in the same OT VLAN communicate via the branch gateway where a matching Reject firewall rule can deny their traffic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#25709c"/></marker></defs><rect width="1320" height="750" rx="22" fill="#f8fbff"/><text x="40" y="51" font-family="Arial" font-size="30" font-weight="bold" fill="#153f65">Macro vs micro: where is the security boundary?</text>
<rect x="34" y="80" width="605" height="560" rx="18" fill="#eef6fc" stroke="#aac9de" stroke-width="2"/><rect x="681" y="80" width="605" height="560" rx="18" fill="#edf9f7" stroke="#90c8b7" stroke-width="2"/>
<text x="58" y="119" font-family="Arial" font-size="25" font-weight="bold" fill="#174c77">MACRO  •  Between networks</text><text x="704" y="119" font-family="Arial" font-size="25" font-weight="bold" fill="#166858">MICRO  •  Between devices</text>
<rect x="74" y="172" width="220" height="112" rx="15" fill="white" stroke="#75abcc" stroke-width="2"/><text x="184" y="217" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#173f65">Subnet10</text><text x="184" y="247" text-anchor="middle" font-family="Arial" font-size="16" fill="#45687d">Windows server</text>
<rect x="382" y="172" width="216" height="112" rx="15" fill="white" stroke="#75abcc" stroke-width="2"/><text x="490" y="217" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#173f65">Subnet20</text><text x="490" y="247" text-anchor="middle" font-family="Arial" font-size="16" fill="#45687d">IoT endpoint</text>
<path d="M294 226 H382" stroke="#a45245" stroke-width="5" stroke-dasharray="9 6"/><text x="338" y="208" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#9e3f34">DROP</text>
<rect x="96" y="341" width="479" height="95" rx="14" fill="#dcedfb" stroke="#7faece"/><text x="336" y="379" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#1c527f">ZTB firewall policy</text><text x="336" y="409" text-anchor="middle" font-family="Arial" font-size="17" fill="#3a6683">Source/destination subnet match</text>
<text x="65" y="500" font-family="Arial" font-size="17" fill="#335d77">Lab 2 example: 10.1.10.0/24 → 10.1.20.0/24</text><text x="65" y="534" font-family="Arial" font-size="16" fill="#335d77">Tests traffic crossing VLAN / subnet groups.</text><text x="65" y="568" font-family="Arial" font-size="16" fill="#335d77">Does not, by itself, control peers in one VLAN.</text>
<rect x="715" y="173" width="230" height="120" rx="15" fill="white" stroke="#7bbca8" stroke-width="2"/><text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#146b59">OT1</text><text x="830" y="253" text-anchor="middle" font-family="Arial" font-size="17" fill="#336d5c">Host /32</text>
<rect x="1021" y="173" width="232" height="120" rx="15" fill="white" stroke="#7bbca8" stroke-width="2"/><text x="1137" y="220" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#146b59">OT2</text><text x="1137" y="253" text-anchor="middle" font-family="Arial" font-size="17" fill="#336d5c">Host /32</text>
<path d="M945 239 H1021" stroke="#a45245" stroke-width="4" stroke-dasharray="9 6"/><text x="982" y="222" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#a45245">No direct peer path</text>
<path d="M830 293 V354 H917" stroke="#217e6f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1137 293 V354 H1010" stroke="#217e6f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="855" y="345" width="264" height="103" rx="15" fill="#d8f3e9" stroke="#4fa38a" stroke-width="2"/><text x="987" y="387" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#135e50">ZTB gateway</text><text x="987" y="418" text-anchor="middle" font-family="Arial" font-size="16" fill="#255f53">Inspect → REJECT</text>
<text x="704" y="500" font-family="Arial" font-size="17" fill="#285f56">Lab 4 example: 10.1.30.0/24 → 10.1.30.0/24</text><text x="704" y="534" font-family="Arial" font-size="16" fill="#285f56">/32 addressing makes the peer flow visible to ZTB.</text><text x="704" y="568" font-family="Arial" font-size="16" fill="#285f56">Rule matches OT subnet, not just the two host IPs.</text>
<rect x="35" y="660" width="1250" height="65" rx="12" fill="#f0f4fb" stroke="#c1d1df"/><text x="57" y="689" font-family="Arial" font-size="17" font-weight="bold" fill="#1b527e">Critical difference:</text><text x="230" y="689" font-family="Arial" font-size="17" fill="#345875">A VLAN boundary is not an endpoint boundary. The network-of-one route enables same-VLAN enforcement.</text><text x="57" y="714" font-family="Arial" font-size="14" fill="#60788b">Airgap-Lite and Airgap+ behave differently; this visual depicts the /32 network-of-one model used in the lab.</text></svg>