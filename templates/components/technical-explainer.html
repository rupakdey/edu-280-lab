<!--
  Optional technical-context component.

  Use only when understanding the concept materially improves the lab.

  Rules:
  - Explain WHY before HOW.
  - Keep it concise.
  - Prefer flows, relationships, diagrams, or compact comparisons.
  - Do not duplicate the numbered configuration instructions.
-->

<section
  class="section technical-explainer"
  id="{{EXPLAINER_ID}}"
>

  <div class="section-head stacked">

    <div class="eyebrow">
      Technical context
    </div>

    <h2>
      {{EXPLAINER_TITLE}}
    </h2>

    <p>
      {{EXPLAINER_SUMMARY}}
    </p>

  </div>


  <div class="card pad">

    {{EXPLAINER_CONTENT}}

    {{EXPLAINER_VISUAL}}

  </div>

</section>
