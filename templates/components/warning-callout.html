<!--
  Use for important cautions, tenant changes, destructive operations,
  credential warnings, or actions learners could easily misunderstand.
-->

<div class="callout warning">

  <div class="callout-symbol">
    !
  </div>

  <div>

    <div class="callout-title">
      {{WARNING_TITLE}}
    </div>

    <p>
      {{WARNING_TEXT}}
    </p>

  </div>

</div>
