<!--
  Canonical configuration table.

  Use when several settings/values would otherwise create dense prose.
-->

<table class="credentials settings-table">

  <thead>
    <tr>
      <th>{{SETTING_HEADER}}</th>
      <th>{{VALUE_HEADER}}</th>
    </tr>
  </thead>

  <tbody>

    {{CONFIG_ROWS}}

  </tbody>

</table>

  Example CONFIG_ROWS:

  <tr>
    <td>Rule Name</td>
    <td><strong>Allow_Private_App</strong></td>
  </tr>

  <tr>
    <td>Action</td>
    <td><strong>Allow</strong></td>
  </tr>
-->
